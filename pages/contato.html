<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contato — Black Void</title>
  <meta name="description" content="Fale com a Black Void." />
  <link rel="icon" href="assets/img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="../agent/styles.css">

  <style>
    .select {
      margin-top: 10px;
      display: block;
      font-size: 11px;
      letter-spacing: .1em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
      color: #E02920;
    }

    .text {
      margin-top: 10px;
      display: block;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .1em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px
    }

    .contact-grid {
      grid-template-columns: 1fr 1fr;
      gap: 70px;
      margin-top: 20px;
    }

    @media (max-width:900px) {
      .contact-grid {
        grid-template-columns: 1fr
      }
    }

    .field {
      margin-bottom: 26px
    }

    .field label {
      display: block;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .1em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line-2);
      color: var(--fg);
      padding: 12px 0;
      font-family: var(--font-body);
      font-size: 16px;
      transition: border-color .25s;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--void-red)
    }

    .field textarea {
      resize: vertical;
      min-height: 100px
    }

    .field select option {
      background: #0f0f0e
    }

    .contact-info a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 0;
      border-bottom: 1px solid var(--line);
      font-size: 15px;
      transition: .25s
    }

    .contact-info a:hover {
      color: var(--void-red);
      padding-left: 6px
    }

    .contact-info span.k {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted)
    }
  </style>
</head>
<script src="../agent/kira.js"></script>

<body>
  <div id="loader"><img class="ldr-mark" src="assets/img/logo.png" alt="" />
    <div class="ldr-word">BLACK VOID</div>
    <div class="ldr-bar"><i></i></div>
  </div>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>
  <canvas class="void-canvas"></canvas>

  <nav>
    <div data-include="../components/menu-superior.html"></div>
  </nav>

  <main>
    <section class="page-hero" style="padding-bottom:60px">
      <div class="wrap">
        <div class="crumb reveal">HOME <i>/</i> CONTATO</div>
        <span class="eyebrow reveal">Vamos conversar</span>
        <h1 class="h-xl reveal" style="margin-top:22px">Conta seu<br />projeto <i
            style="font-style:normal;color:var(--void-red)">pra gente.</i></h1>
      </div>
    </section>

    <section style="padding-top:0">
      <div class="wrap contact-grid">
        <div class="contact">
          <form id="contactForm">

            <!-- Configurações invisíveis -->
            <input type="hidden" name="_subject" value="Novo orçamento recebido!">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">

            <div class="contact-grid">

              <div class="field">
                <label>Seu nome *</label>
                <input type="text" name="Nome" placeholder="João Silva" required>
              </div>

              <div class="field">
                <label>Nome da empresa</label>
                <input type="text" name="Empresa" placeholder="Empresa LTDA">
              </div>

              <div class="field">
                <label>E-mail *</label>
                <input type="email" name="Email" placeholder="joao@empresa.com" required>
              </div>

              <div class="field">
                <label>WhatsApp</label>
                <input type="tel" name="WhatsApp" placeholder="(11) 99999-9999">
              </div>

              <div class="field">
                <label>Tipo de negócio</label>
                <select class="select" name="Tipo de Negócio">
                  <option value="">Selecione...</option>
                  <option>Restaurante / Bar</option>
                  <option>Salão / Studio</option>
                  <option>Loja / Varejo</option>
                  <option>Serviços Profissionais</option>
                  <option>Saúde / Clínica</option>
                  <option>Educação</option>
                  <option>Outro</option>
                </select>
              </div>

              <div class="field">
                <label>Conte sobre seu projeto</label>
                <textarea name="Projeto"
                  placeholder="O que você precisa? Já tem alguma referência de site que gosta?"></textarea>
              </div>

            </div>

            <div class="field">
              <button id="submitBtn" class="btn" type="submit">
                Enviar
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round" />
                </svg>
              </button>
              <span class="text">Respondemos em até 24h.</span>
            </div>
        </div>
        </form>

        <div class="reveal">
          <div class="contact-info">
            <a href="mailto:contato@blackvoid.com.br"><span>contato@blackvoid.com.br</span><span
                class="k">E-MAIL</span></a>
            <a href="#"><span>+55 (67) 00000-0000</span><span class="k">WHATSAPP</span></a>
            <a href="#"><span>@blackvoid</span><span class="k">INSTAGRAM</span></a>
            <a href="#"><span>Black Void</span><span class="k">LINKEDIN</span></a>
            <a href="#"><span>Dourados, MS — Brasil</span><span class="k">SEDE</span></a>
          </div>

        </div>
      </div>
    </section>
  </main>

  <footer>
      <div data-include="../components/menu.html"></div>
  </footer>
  <script src="../components/include.js"></script>
  <script src="assets/js/main.js"></script>

  <script src="api-config.js"></script>
  <script src="main.js"></script>
  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

  <script>
    (function () {
      emailjs.init("M30bjVb-4rIURj_ya");
    })();

    document.querySelector("#contactForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const btn = document.querySelector("#submitBtn");
      btn.innerText = "Enviando...";
      btn.disabled = true;

      emailjs.send("service_4vyudkh", "template_6h56ei2", {
        nome: document.querySelector('input[name="Nome"]').value,
        empresa: document.querySelector('input[name="Empresa"]').value,
        email: document.querySelector('input[name="Email"]').value,
        whatsapp: document.querySelector('input[name="WhatsApp"]').value,
        tipo: document.querySelector('select[name="Tipo de Negócio"]').value,
        projeto: document.querySelector('textarea[name="Projeto"]').value
      })
        .then(function () {
          btn.innerText = "Mensagem enviada ✅";
          document.querySelector("#contactForm").reset();
          btn.disabled = false;
        })
        .catch(function (error) {
          btn.innerText = "Erro ao enviar ❌";
          btn.disabled = false;
          console.error("Erro:", error);
        });
    });
  </script>


    
  
<script src="../components/include.js"></script>
  <script src="assets/js/main.js"></script>


</body>

</html>
